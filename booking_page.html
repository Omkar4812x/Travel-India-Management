<body>
  <h1>Sangli Travel Booking</h1>
  <form id="booking-form">
    <label for="destination">Destination:</label>
    <select id="destination" name="destination">
      <option value="agra">Agra</option>
      <option value="goa">Goa</option>
      <option value="jaipur">Jaipur</option>
      <option value="manali">Manali</option>
      <option value="mumbai">Mumbai</option>
    </select>


    <label for="departure-date">Departure Date:</label>
    <input type="date" id="departure-date" name="departuredate" min="<?php echo date('Y-m-d'); ?>" required>

    <label for="return-date">Return Date (if applicable):</label>
    <input type="date" id="return-date" name="returndate" min="<?php echo date('Y-m-d'); ?>">

    <label for="passengers">Number of Passengers:</label>
    <input type="number" id="passengers" name="passengers" min="1" required>

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>

    <label for="comments">Additional Comments or Requests:</label>
    <textarea id="comments" name="comments" rows="4"></textarea>

    <input type="submit" value="Submit">
  </form>

  <!-- Your JavaScript code -->
  <script>
    function submitForm() {
      var destination = document.getElementById('destination').value;
      var departureDate = document.getElementById('departure-date').value;
      var returnDate = document.getElementById('return-date').value;
      var passengers = document.getElementById('passengers').value;
      var name = document.getElementById('name').value;
      var email = document.getElementById('email').value;
      var phone = document.getElementById('phone').value;
      var comments = document.getElementById('comments').value;

      localStorage.setItem('destination', destination);
      localStorage.setItem('departureDate', departureDate);
      localStorage.setItem('returnDate', returnDate);
      localStorage.setItem('passengers', passengers);
      localStorage.setItem('name', name);
      localStorage.setItem('email', email);
      localStorage.setItem('phone', phone);
      localStorage.setItem('comments', comments);

      // Redirect to confirmation page
      window.location.href = 'confirmation.html';
    }

    document.getElementById('booking-form').addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent default form submission
      submitForm(); // Call the function to handle form submission
    });
  </script>
</body>
